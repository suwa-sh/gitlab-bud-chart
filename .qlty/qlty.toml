config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  # 参考用に置いている別プロジェクトのサンプルコード。このリポジトリの品質基準では検査しない
  "docs/develop/sample/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

# コードスメル系 (複雑度・重複リテラル等) は助言扱い。ゲート (--fail-level medium) では落とさない
[[triage]]
[triage.match]
plugins = ["radarlint-python", "radarlint-js", "radarlint-iac"]
[triage.set]
level = "low"

# lockfile は npm が生成・管理するため整形しない
[[exclude]]
plugins = ["prettier"]
file_patterns = ["**/package-lock.json"]

# pytest はアサーションに assert を使い、検証用の文字列 ("/tmp" 等) も含むため、
# テストファイルの bandit は偽陽性になる。テスト配下に限定して除外する (本体コードでは検査を維持)
[[exclude]]
plugins = ["bandit"]
file_patterns = ["**/tests/**", "**/test_*.py", "**/conftest.py"]

# .devcontainer は開発専用イメージ。ファイアウォール (iptables) 設定のため意図的に root / sudo を使うので、
# 本番イメージ向けのコンテナ検査からは外す (frontend / backend の Dockerfile では検査を維持)
[[exclude]]
plugins = ["hadolint", "trivy", "radarlint-iac"]
file_patterns = [".devcontainer/**"]


[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

[[plugin]]
name = "hadolint"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

# frontend は ESLint 8 系（.eslintrc.cjs）を使う。9 系は flat config 前提で設定を解決できないため固定する
[[plugin]]
name = "eslint"
version = "8.57.1"
package_file = "frontend/package.json"
package_filters = ["eslint"]

[[plugin]]
name = "trivy"

[[plugin]]
name = "prettier"

[[plugin]]
name = "radarlint-js"
